name: Deploy Backend Proxy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Package ASP.NET Core Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/NeuroScript.Backend.sln

      - name: Build Solution
        run: dotnet build backend/NeuroScript.Backend.sln -c Release --no-restore

      - name: Execute Tests
        run: dotnet test backend/NeuroScript.Backend.sln -c Release --no-build --verbosity normal

      - name: Publish API Binary
        run: dotnet publish backend/src/Api/NeuroScript.Api.csproj -c Release -o ./publish

      - name: Upload Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neuroscript-backend-publish
          path: ./publish
