name: NeuroScript AI CI/CD Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Environment
        run: flutter --version

      - name: Resolve Project Dependencies
        run: flutter pub get

      - name: Run Build Runner (Code Generation)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute Automated Test Suite (Unit & Widget)
        run: flutter test --coverage

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuroscript-ai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
