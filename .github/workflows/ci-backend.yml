name: Backend Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore NeuroScript.Backend.sln

      - name: Build Solution
        run: dotnet build NeuroScript.Backend.sln --no-restore --configuration Release

      - name: Run Test Suite
        run: dotnet test NeuroScript.Backend.sln --no-build --configuration Release --verbosity normal
