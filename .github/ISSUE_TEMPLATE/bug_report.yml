name: Bug Report
description: Report an issue or unexpected behavior in NeuroScript AI
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this form to help us locate and resolve the bug.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "Flutter Mobile App (UI / Themes)"
        - "Local Database (Drift / SQLCipher)"
        - "Camera / OpenCV / OCR"
        - "ASP.NET Core Proxy"
        - "Gemini AI / Grounding Validator"
        - "On-Device SLM Fallback"
        - "CI / Tooling"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, device model, Flutter / .NET SDK versions.
    validations:
      required: false
